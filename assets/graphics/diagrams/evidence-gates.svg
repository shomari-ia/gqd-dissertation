<rect x="414" y="125" width="296" height="190" rx="12" fill="#303335" stroke="#C2C6C7" stroke-width="2"/><text x="438" y="165" fill="#D8C194">02 / NUMERICAL QC</text><text x="438" y="215">G4–G5</text><text x="438" y="248" font-size="18" font-weight="normal" fill="#C2C6C7">Execution and frequency</text>
<path d="M726 220h28m-9-9 9 9-9 9" fill="none" stroke="#D8C194" stroke-width="3"/>
<rect x="769" y="125" width="296" height="190" rx="12" fill="#303335" stroke="#C2C6C7" stroke-width="2"/><text x="793" y="165" fill="#D8C194">03 / SCIENTIFIC GATES</text><text x="793" y="215">G6–G9</text><text x="793" y="248" font-size="18" font-weight="normal" fill="#C2C6C7">Comparability and archive</text>
