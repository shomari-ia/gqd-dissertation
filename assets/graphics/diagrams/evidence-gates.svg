<g font-family="Arial,Helvetica,sans-serif">
<text x="62" y="61" fill="#E6E7E8" font-size="25" letter-spacing="3">FROM CALCULATION TO SCIENTIFIC EVIDENCE</text>
<path d="M62 79H1376" stroke="#D8C194" stroke-width="2"/>
<g font-size="20" fill="#F1F2F2" font-weight="bold">
<rect x="59" y="125" width="296" height="190" rx="12" fill="#303335" stroke="#C2C6C7" stroke-width="2"/><text x="83" y="165" fill="#D8C194">01 / MODEL IDENTITY</text><text x="83" y="215">G0–G3</text><text x="83" y="248" font-size="18" font-weight="normal" fill="#C2C6C7">Input, topology, geometry</text>
