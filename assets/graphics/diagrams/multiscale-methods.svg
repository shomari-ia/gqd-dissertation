<title id="title">GQD multiscale modeling program — conceptual architecture</title>
<desc id="desc">Three research components: DFT and drug loading as the primary Phase I component; planned protonation and pH-dependent modeling; planned molecular docking and molecular dynamics. Does not indicate completed computations.</desc>
